# delivery.yaml — the 'delivery' configuration family (COMMITTED).
#
# CONFIGURATION, not settings: values. The boolean enable map lives in
# .sidekicks/config/settings/. See docs/guide/settings-vs-configuration.md.
#
# Credentials NEVER live here. Every credential key appears with an empty value so a fresh
# clone can see what to supply; the values go in the git-ignored 'delivery.secret.yaml'
# sibling. Write with `sidekicks config set`, read with `sidekicks config get <block>`.
#
# A block that is present but entirely commented out is INERT: it documents the schema, and
# the block still resolves to the owning skill's config.defaults.yaml until a key is
# uncommented here.

##############################################################################
# Generated by `sidekicks config sync` from the installed skills' config.defaults.yaml.
# Uncomment a key to override the skill's default.
##############################################################################

# Delivery mode for automated implementation. The only key is `mode`:
#   native     implementation stays with the parent agent (the default when nothing is set)
#   multi_cli  implementation is delegated to CLI executors through the bound preset
# Precedence: run override > project > root > native. A project block replaces the root block
# whole, so `mode: native` in a project cancels a root `multi_cli`. The executor, model and
# effort come from the preset and the executor registry, never from this block.
# multi_cli_execution:
#   mode: native
