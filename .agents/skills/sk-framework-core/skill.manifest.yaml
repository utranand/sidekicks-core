schema: 1
skill: sk-framework-core

# AUTHORED: findings a human read and REJECTED, each with the reason.
not_required:
  framework_files:
    - path: lib/sk-cli/cli.mjs
      why: 'SKILL.md names it while explaining WHY this skill is inert inside a forged core: a mounted workspace has no lib/sk-cli/cli.mjs at its root, so the inherit engine refuses to treat it as a source repo. The path is quoted as the condition of that refusal, not read or invoked here. Nothing in this skill opens it.'

requires:
  # Repo-root files this skill runs or reads. They do NOT travel with the skill, so
  # `degraded:` has to say what a lifted copy loses.
  framework_files:
  # The engine spawns the core-forge backend by path for every forge, drift check and verify. Declared
  # here rather than left implicit because the skill is useless without it in a way no error message
  # would make obvious - the script exits 3 naming a path, not a missing skill.
  sibling_skills:
    - skill: sk-publish-core
      how: subprocess
      degraded: 'The publishing workflow and its root-script lifecycle rule are incomplete. Callable projection and release engines live in lib/core-forge and are invoked through sidekicks core verbs; do not substitute a deleted skill-local script.'
