  VERSION.json: sha256:9b2231a8bb1159a1c74fb15ba78c2f1f160039c4875cc75cecadee88d16742af
  scripts/capability.mjs: sha256:1ed8d002e1401af076c34acf3ad11220bb50602320d9f9b830226e200ed76d6e
  scripts/readiness.mjs: sha256:e1e7534abca0b5b32025d020af89377eacf146c18c6140cb640d2a86f077f57e
