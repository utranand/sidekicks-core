# skill.manifest.yaml — what this skill needs in order to run.
#
# Sections under `requires:` are AUTHORED: generated once from what the scanner found, then
# maintained by hand. `config:`, `framework_hooks:` and `bundle:` are DERIVED — they are
# regenerated by `sidekicks skill manifest <skill> --apply` and a hand edit is reported as
# drift. Every `TODO` below is a question only a human can answer; `sidekicks skill doctor`
# keeps asking until it is gone.
#
# Writing prose here: `&word` and `*word` are refused by the yaml-subset reader ANYWHERE in
# a line, quoting and block scalars included (lib/yaml-subset/yaml.mjs findPoison) — so
# spell "and", and emphasize without asterisks, or the file stops loading.

schema: 1
skill: sk-publish-core

# AUTHORED: findings a human read and REJECTED, each with the reason.
#
# Both detected edges are rejected, and neither is a judgment call about degradation - they are two
# different ways for a skill NAME to appear without a skill being involved.
not_required:
  binaries:
    - name: launchctl
      why: 'SKILL.md names it while describing what scripts/install-delegate-launchagent.sh does once a RUNTIME runs it (it bootstraps the LaunchAgent, which is why the doc says to run it deliberately). This skill never shells out to launchctl - it copies the installer. macOS-only, and no verb of this skill degrades without it.'
  sibling_skills:
    - skill: sk-cli
      why: 'scripts/core-forge.mjs:149 is `existsSync(join(root, "lib", "sk-cli", "cli.mjs"))`, the sanity check that refuses to run against anything that is not a sidekicks source repo. `sk-cli` there is the name of a directory under lib/ that happens to collide with the name of a skill. The path segment is not a reference to the skill and no sk-cli file is read.'
    - skill: sk-hello
      why: 'references/runtime-anatomy.md:166 is inside a JSON EXAMPLE of a forged runtime manifest, showing what an inherited-skill record looks like ("source_path": ".agents/skills/sk-hello", a version, a commit, a file-hash map). An illustration of the record format, with hello standing in for any skill. The scanner reads it as `subprocess, documented, by path` because a documented path is normally an invocation; here the path is sample data.'
    - skill: sk-office-viz
      why: 'scripts/core-forge.mjs:111 names it as a VALUE in the SCRIPT_SUBDIR_OWNERS gating map — data deciding whether scripts/office-viz-themes/ travels when that skill is selected. The engine never invokes or reads the skill; the name is a selection key.'
    - skill: sk-agent-standby
      why: 'scripts/core-forge.mjs:113 — same SCRIPT_SUBDIR_OWNERS gating map (scripts/launchd/). A selection key, not a dependency.'
    - skill: sk-agent-master
      why: 'scripts/core-forge.mjs:113 — same SCRIPT_SUBDIR_OWNERS gating map (scripts/launchd/). A selection key, not a dependency.'
    - skill: sk-agent-tray
      why: 'scripts/core-forge.mjs:113 — same SCRIPT_SUBDIR_OWNERS gating map (scripts/launchd/). A selection key, not a dependency.'
  # The delegate-agent operating surface. The scanner sees these paths in the SKILL.md table that
  # documents what a runtime carrying delegate agents receives, and a documented repo-root path is
  # normally a dependency - here it is PAYLOAD. Declaring them as requires.framework_files would be
  # actively wrong twice over: this skill never runs them (it copies them, byte for byte, like every
  # other file it moves), and the closure would then claim them for any runtime carrying
  # sk-publish-core, so a core with no agents at all would ship a tray launcher whose python never
  # travelled. The travel decision is made in code instead, by DELEGATE_SCRIPT_FILES and
  # DELEGATE_SCRIPT_SUBDIRS, gated on the runtime actually carrying an agent.
  framework_files:
    - path: scripts/start-agent-delegate.sh
      why: 'Payload, not a dependency: named in the SKILL.md table of what a delegate-carrying runtime receives, and claimed at forge time by DELEGATE_SCRIPT_FILES (scripts/core-forge.mjs). The engine copies it; it never executes it. Its absence from the SOURCE repo is handled - resolveScriptOwnership only claims what exists.'
    - path: scripts/install-delegate-launchagent.sh
      why: 'Payload, not a dependency - same DELEGATE_SCRIPT_FILES claim as start-agent-delegate.sh. Copied for the runtime to run later (it calls launchctl), never invoked by this skill.'
    - path: scripts/uninstall-delegate-launchagent.sh
      why: 'Payload, not a dependency - the uninstall half of the LaunchAgent pair, copied by the same claim.'
    - path: scripts/agent-tray.sh
      why: 'Payload, not a dependency - copied by the same claim. It execs sk-agent-tray/scripts/agent_tray.py, which arrives only with that skill, so it is deliberately shipped PREPARED rather than functional; nothing in this skill runs it.'

# Beyond the two files below, nothing is required. This skill is the one that MOVES other skills
# into a runtime, so it names a great many of them - 45 more turn up in assets/presets.yaml, which
# is a curated list of what each preset ships, and in code comments about which folders travel.
# None of that is a dependency: the skill reads its own assets and copies directories.
#
# It also does not need `sqlite3`, which the scanner reported until this batch: the name sits in
# assets/py-stdlib.json among the Python STDLIB MODULE names used to decide whether an import needs
# a pip package. JSON is data, never a command surface, and the scan now skips it.
requires:
  # The scripts/ ownership gate (AAP-111) reads these two source-repo modules at forge time,
  # dynamically imported from the resolved source root. The engine only ever runs FROM a sidekicks
  # source repo (resolveSourceRoot refuses anything without lib/sk-cli/cli.mjs), so they are
  # present wherever the skill is legitimately invoked.
  framework_files:
    - path: lib/framework-settings/core-registry.mjs
      degraded: 'create/add/verify die with exit 3 - the CORE_HOOKS owner map is one of the two ownership sources deciding which scripts/ files travel, and shipping everything instead would re-create the AAP-111 unowned-payload defect.'
    - path: lib/skill-package/closure.mjs
      degraded: 'create/add/verify die with exit 3 - skillClosure aggregates the selected skills'' manifest framework_files/framework_hooks claims, the second ownership source for the scripts/ travel gate.'
    - path: scripts/run-tests.mjs
      degraded: 'every forged runtime ships a green test gate that runs nothing. The launcher is SCRIPT_FILE_FLOOR - it travels unconditionally - because the alternative is what v2.0.0 shipped: a package.json glob that discovered zero files and still exited 0, so the release recorded a passing suite while 89 real tests sat unrun. Without it here, create writes a runtime whose npm test cannot be honest, and the publish gate that asks the artifact for its own discovered test count has nothing to ask.'
      # seen at scripts/core-forge.mjs:222
    - path: lib/core-lifecycle/config-templates.mjs
      degraded: runtime create/add/verify cannot inventory or validate safe configuration templates; forged runtimes may omit required example-derived scaffolds or carry incomplete configuration without a deterministic warning.
      # seen at scripts/core-forge.mjs:33
    - path: lib/skill-package/framework-preset.mjs
      degraded: 'scripts/core-forge.mjs imports this module at startup, so no inherit verb can run without it; in particular the dynamic framework preset cannot be resolved or forged.'
      # seen at scripts/core-forge.mjs:34
    - path: lib/skill-package/runtime-projection.mjs
      degraded: 'scripts/core-forge.mjs imports this module at startup, so no inherit verb can run without it. It decides which files of a skill folder travel into a runtime AND produces the drift baseline for the same set, so there is no degraded mode where copying still works and only the accounting is lost - a copy taken from one policy and a baseline taken from another is a permanent false fast-forward.'
      # seen at scripts/core-forge.mjs:35
  # DERIVED from skill.yaml — do not hand-edit. The rules and criteria this skill OWNS.
  framework_rules:
    - id: rule.repo-root-scripts-lifecycle
      title: 'Repo-root scripts/ — add, move and remove by ownership'
      body: rules/rule.repo-root-scripts-lifecycle.md

