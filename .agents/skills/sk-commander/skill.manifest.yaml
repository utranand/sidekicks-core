# skill.manifest.yaml — what this skill needs in order to run.
#
# Sections under `requires:` are AUTHORED: generated once from what the scanner found, then
# maintained by hand. `config:`, `framework_hooks:` and `bundle:` are DERIVED — they are
# regenerated by `sidekicks skill manifest <skill> --apply` and a hand edit is reported as
# drift. Every `TODO` below is a question only a human can answer; `sidekicks skill doctor`
# keeps asking until it is gone.
#
# Writing prose here: `&word` and `*word` are refused by the yaml-subset reader ANYWHERE in
# a line, quoting and block scalars included (lib/yaml-subset/yaml.mjs findPoison) — so
# spell "and", and emphasize without asterisks, or the file stops loading.

schema: 1
skill: sk-commander

requires:
  # Skills this one composes on. A sibling is never copied in and never auto-installed,
  # so `degraded:` has to say what happens when it is absent.
  sibling_skills:
    - skill: sk-jira-footprint
      how: subprocess
      entry: scripts/footprint.py
      # OPTIONAL, and now stated as such in the contract rather than only in prose. The degraded
      # sentence below already described a fully working commander without this sibling — the call
      # is best-effort and its exit code is ignored — but `skill verify` graded any absent sibling
      # as an integrity ERROR, so a lightweight core that ships commander and not jira-footprint
      # failed a hard gate for a dependency it does not actually need. Absence of an optional
      # sibling is a notice; `--strict` still surfaces it.
      optional: true
      degraded: 'no per-step progress notes and no started/done bookends reach the card. The sequence itself is untouched: SKILL.md marks the call "best-effort — never fail the step over this" and instructs the runner to ignore any exit code and proceed, so the step''s real result stands.'
      # documented, seen at SKILL.md:405
    - skill: sk-forge-project-behavior
      how: subprocess
      optional: true
      degraded: 'The behaviour preflight cannot run, so this run proceeds without the project''s TTSR register and criterion.project-behavior-preflight is unenforced for it. Nothing else breaks: the underlying rules in AGENTS.md and the project''s docs/rules/ still apply, and the hook — where the host CLI fires one — is the other half of the same gate.'
      # documented, seen at SKILL.md:29
  # Framework surfaces this skill CALLS but does not carry. Not installable: a lifted copy of this
  # folder cannot bring them, so each row states what the absence costs.
  framework_files:
    - path: lib/run-events/schema.mjs
      degraded: 'the run-event sidecar is unavailable, so scripts/run-event.mjs preflight exits 4 and the run proceeds with event recording OFF (the report says so). No stage transition is mirrored to events.v1.jsonl and no run.reconciled is written. The sequence itself is untouched: the sidecar is a DIAGNOSTIC audit trail and the Workflow journal plus the stages array remain the resume source of truth, so a missing diagnostic never halts real work.'
      # seen at scripts/run-event.mjs (dynamic import, resolved from the repo root at run time)
    - path: bin/sidekicks
      degraded: 'the `sidekicks artifacts events` verb cannot be invoked, which is the same outcome as the row above - preflight exits 4 and the run records nothing. The CLI is the ONLY writer of events.v1.jsonl on purpose: it owns the lock, the sequence assignment and the tail-recovery policy, and three engines in two languages append through it, so this skill never writes the file itself.'
      # seen at scripts/run-event.mjs and SKILL.md (Run events)
  # DERIVED from skill.yaml — do not hand-edit. The rules and criteria this skill OWNS.
  framework_rules:
    - id: criterion.command-sequences
      title: A command-sequence exists to be executed
      body: rules/criterion.command-sequences.md

